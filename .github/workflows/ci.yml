name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Show job-level variable
        run: echo "Running in $NODE_ENV"

      - name: Use a secret safely
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "Token length: ${#DEMO_TOKEN}"

      - name: Run tests
        run: npm test

      - name: Generate test report for artifact   # NEW in this lab
        if: always()
        run: npm test -- --json --outputFile=test-report.json || true

      - name: Upload test report                   # NEW in this lab: downloadable from the run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.json
