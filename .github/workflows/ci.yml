name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Use a secret safely           # NEW in this lab: requires a repo secret named DEMO_TOKEN
        env:                                 # Settings -> Secrets and variables -> Actions -> New repository secret
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "Token length: ${#DEMO_TOKEN}"

      - name: Run tests
        run: npm test
